<script>
const POLL_MS = 1000;

const violations = [
  { id: 'CKV2_AWS_6',  name: 'No public access block',  sev: 'HIGH' },
  { id: 'CKV_AWS_18',  name: 'No access logging',        sev: 'MEDIUM' },
  { id: 'CKV_AWS_21',  name: 'No versioning',            sev: 'MEDIUM' },
  { id: 'CKV2_AWS_61', name: 'No lifecycle policy',      sev: 'LOW' },
  { id: 'CKV2_AWS_62', name: 'No event notifications',   sev: 'LOW' },
];

const checks = [
  'Public access block',
  'Access logging',
  'Versioning',
  'Lifecycle policy',
  'Event notifications',
];

function buildViolations() {
  const list = document.getElementById('violations-list');
  violations.forEach(v => {
    const row = document.createElement('div');
    row.className = 'violation-row';
    row.id = 'vrow-' + v.id;
    const sevClass = { HIGH: 'badge-high', MEDIUM: 'badge-medium', LOW: 'badge-low' }[v.sev];
    row.innerHTML = `
      <div class="v-left">
        <span class="v-id">${v.id}</span>
        <span class="v-name">${v.name}</span>
      </div>
      <span class="badge ${sevClass}" id="badge-${v.id}">${v.sev}</span>
    `;
    list.appendChild(row);
  });
}

function buildBars() {
  const wrap = document.getElementById('checks-bars');
  checks.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="bar-top">
        <span class="bar-label">${c}</span>
        <span class="bar-pct" id="barpct-${i}">100%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barfill-${i}"></div>
      </div>
    `;
    wrap.appendChild(row);
  });
}

function setStage(id, state) {
  const el = document.getElementById('stage-' + id);
  if (!el) return;
  el.className = 'stage-wrap ' + state;
  const prev = el.previousElementSibling;
  if (prev && state === 'done') prev.className = 'stage-wrap done';
}

function resolveViolations(waivedIds) {
  waivedIds = waivedIds || [];
  violations.forEach(v => {
    const row   = document.getElementById('vrow-' + v.id);
    const badge = document.getElementById('badge-' + v.id);
    if (waivedIds.includes(v.id)) {
      if (row)   { row.classList.remove('resolved'); row.classList.add('waived'); }
      if (badge) { badge.textContent = 'WAIVED'; badge.className = 'badge badge-waived'; }
    } else {
      if (row)   row.classList.add('resolved');
      if (badge) { badge.textContent = 'FIXED'; badge.className = 'badge badge-ok'; }
    }
  });
  checks.forEach((_, i) => {
    const fill = document.getElementById('barfill-' + i);
    const pct  = document.getElementById('barpct-' + i);
    if (fill) fill.style.width = '100%';
    if (pct)  pct.classList.add('visible');
  });
}

function setMetric(id, val, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = val;
  el.className = 'metric-value' + (cls ? ' ' + cls : '');
}

function updateStatusPill(text) {
  document.getElementById('status-text').textContent = text;
}

function updateFooterTime() {
  const now = new Date();
  document.getElementById('footer-time').textContent =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

async function tryLoadLastRun() {
  try {
    const res = await fetch('/last_run.json?t=' + Date.now());
    if (!res.ok) return;
    const data = await res.json();
    const banner  = document.getElementById('last-run-banner');
    const label   = document.getElementById('last-run-label');
    const outcome = document.getElementById('last-run-outcome');
    const dur     = data.metrics?.duration
      ? (data.metrics.duration < 60
          ? data.metrics.duration + 's'
          : (data.metrics.duration / 60).toFixed(1) + 'm')
      : '—';
    label.textContent   = `Last run · ${dur} · ${data.metrics?.violations_found ?? '?'} violations found`;
    outcome.textContent = data.outcome === 'complete' ? 'PASSED' : 'FAILED';
    outcome.className   = 'last-run-outcome ' + (data.outcome === 'complete' ? 'ok' : 'err');
    banner.classList.add('visible');
  } catch (_) {}
}

let lastStage     = null;
let lastLogIndex  = 0;
let lastWaivedIds = [];

function applyState(data) {
  const stage   = data.stage   || 'idle';
  const logs    = data.logs    || [];
  const metrics = data.metrics || {};

  const pillMap = {
    idle:              'Waiting for pipeline',
    awaiting_approval: 'Awaiting your decision',
    scan:              'Scanning Terraform',
    remediate:         'LLM remediating',
    validate:          'Validating output',
    deploy:            'Deploying to LocalStack',
    metrics:           'Pushing metrics',
    complete:          'Pipeline complete',
    failed:            'Pipeline failed',
  };
  updateStatusPill(pillMap[stage] || stage);

  const pulse = document.getElementById('pulse-dot');
  pulse.style.background = stage === 'failed' ? '#A32D2D' : '#639922';

  const order = ['scan', 'remediate', 'validate', 'deploy', 'metrics'];
  const idx   = order.indexOf(stage);
  order.forEach((s, i) => {
    if (stage === 'complete') {
      setStage(s, 'done');
    } else if (stage === 'failed') {
      setStage(s, i <= order.indexOf(lastStage || 'scan') ? 'done' : '');
    } else if (stage === 'awaiting_approval') {
      setStage(s, i === 0 ? 'done' : '');
    } else {
      if (i < idx)   setStage(s, 'done');
      if (i === idx) setStage(s, 'active');
      if (i > idx)   setStage(s, '');
    }
  });

  if (stage !== 'idle' && stage !== 'awaiting_approval') lastStage = stage;

  if (metrics.violations_found !== undefined)
    setMetric('m-violations', metrics.violations_found,
      metrics.violations_found > 0 ? 'warn' : 'ok');
  if (metrics.violations_after !== undefined)
    setMetric('m-after', metrics.violations_after,
      metrics.violations_after === 0 ? 'ok' : 'warn');
  if (metrics.deploy_ok !== undefined)
    setMetric('m-deploy', metrics.deploy_ok ? 'OK' : 'FAIL',
      metrics.deploy_ok ? 'ok' : 'warn');
  if (metrics.duration !== undefined)
    setMetric('m-duration', metrics.duration < 60
      ? metrics.duration + 's'
      : (metrics.duration / 60).toFixed(1) + 'm', '');

  if (['validate', 'deploy', 'metrics', 'complete'].includes(stage))
    resolveViolations(lastWaivedIds);

  if (logs.length > lastLogIndex) {
    const body = document.getElementById('log-body');
    if (body.querySelector('.log-line[style]')) body.innerHTML = '';

    logs.slice(lastLogIndex).forEach(entry => {
      const ts  = (typeof entry === 'object') ? (entry.ts  || '') : '';
      const msg = (typeof entry === 'object') ? (entry.msg || '') : String(entry);

      const cls = (msg.includes('💥') || msg.includes('ERROR') || msg.includes('FAIL'))
        ? 'error'
        : (msg.includes('✅') || msg.includes('complete') || msg.includes('passed') || msg.includes('successful'))
        ? 'highlight'
        : (msg.includes('⚠️') || msg.includes('stripped') || msg.includes('Wiped'))
        ? 'warn'
        : '';

      const line = document.createElement('div');
      line.className = 'log-line' + (cls ? ' ' + cls : '');

      if (ts) {
        const tsSpan = document.createElement('span');
        tsSpan.className = 'ts';
        tsSpan.textContent = ts;
        line.appendChild(tsSpan);
      }

      const msgSpan = document.createElement('span');
      msgSpan.className = 'msg';
      msgSpan.textContent = msg;
      line.appendChild(msgSpan);

      body.appendChild(line);
    });

    lastLogIndex = logs.length;
    body.scrollTop = body.scrollHeight;
  }
}

// ═══════════════ APPROVAL CHECKLIST ═══════════════

let currentPendingRunId = null;

function renderApprovalCard(pending) {
  const card = document.getElementById('approval-card');

  if (!pending || pending.status !== 'awaiting_approval') {
    card.classList.add('hidden');
    currentPendingRunId = null;
    return;
  }

  if (currentPendingRunId === pending.run_id) return;
  currentPendingRunId = pending.run_id;

  document.getElementById('approval-run-id').textContent = pending.run_id;
  const list = document.getElementById('approval-list');
  list.innerHTML = '';

  pending.violations.forEach(v => {
    const row = document.createElement('div');
    row.className = 'approval-row';
    row.dataset.id        = v.id;
    row.dataset.checkId   = v.check_id;
    row.dataset.checkName = v.check_name;
    row.dataset.resource  = v.resource;
    row.dataset.severity  = v.severity;

    row.innerHTML = `
      <div class="approval-row-top">
        <label>
          <input type="checkbox" checked class="approval-checkbox" data-id="${v.id}" />
          <span class="approval-check-id">${v.check_id}</span>
          <span class="approval-check-name">— ${v.check_name} (${v.resource})</span>
        </label>
        <span class="badge badge-${v.severity.toLowerCase()}">${v.severity}</span>
      </div>
      <div class="waiver-reason-box" id="reason-box-${v.id}">
        <span class="waiver-reason-label">Why are you skipping this?</span>
        <textarea placeholder="e.g. dev-tier bucket, waived per team policy until staging promotion" data-id="${v.id}"></textarea>
      </div>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('.approval-checkbox').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const box = document.getElementById('reason-box-' + e.target.dataset.id);
      box.classList.toggle('visible', !e.target.checked);
    });
  });

  // Reset button to initial state in case a previous run left it green
  const btn = document.getElementById('submit-decisions-btn');
  btn.textContent = 'Review & Confirm';
  btn.style.background = '';
  btn.disabled = false;
  btn.onclick = submitDecisions;

  document.getElementById('approval-card').classList.remove('hidden');
  document.getElementById('approval-msg').textContent = '';
}

function submitDecisions() {
  const msgEl = document.getElementById('approval-msg');
  const rows  = document.querySelectorAll('#approval-list .approval-row');
  const approved_ids = [];
  const waivers = [];

  for (const row of rows) {
    const id       = row.dataset.id;
    const checkbox = row.querySelector('.approval-checkbox');
    if (checkbox.checked) {
      approved_ids.push(id);
    } else {
      const textarea = row.querySelector('textarea');
      const reason   = textarea.value.trim();
      if (!reason) {
        msgEl.textContent = `Please explain why you're skipping ${row.dataset.checkId} before submitting.`;
        msgEl.className   = 'approval-msg error';
        textarea.focus();
        return;
      }
      waivers.push({
        id,
        check_id:   row.dataset.checkId,
        check_name: row.dataset.checkName,
        resource:   row.dataset.resource,
        severity:   row.dataset.severity,
        reason,
      });
    }
  }

  // Validation passed — move to confirmation step
  showDeployConfirmation(approved_ids, waivers);
}

function showDeployConfirmation(approved_ids, waivers) {
  const msg = document.getElementById('approval-msg');
  const btn = document.getElementById('submit-decisions-btn');

  msg.innerHTML = `
    <span style="color:var(--text-primary)">
      <strong>${approved_ids.length}</strong> violation(s) will be remediated &amp; deployed.
      <strong>${waivers.length}</strong> waived.
    </span>
  `;
  msg.className = 'approval-msg';

  btn.textContent       = '🚀 Approve & Deploy';
  btn.style.background  = '#3B6D11';
  btn.disabled          = false;
  btn.onclick           = () => executeApproval(approved_ids, waivers);
}

async function executeApproval(approved_ids, waivers) {
  const msg = document.getElementById('approval-msg');
  const btn = document.getElementById('submit-decisions-btn');
  btn.disabled      = true;
  msg.textContent   = 'Submitting — pipeline resuming…';
  msg.className     = 'approval-msg';

  try {
    const res = await fetch('/api/approve', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ run_id: currentPendingRunId, approved_ids, waivers }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Submission failed');

    lastWaivedIds = waivers.map(w => w.id);
    document.getElementById('approval-card').classList.add('hidden');
    loadWaiverRuns();
  } catch (e) {
    msg.textContent = e.message;
    msg.className   = 'approval-msg error';
    btn.disabled    = false;
  }
}

async function pollPendingReview() {
  try {
    const res = await fetch('/reports/pending_review.json?t=' + Date.now());
    if (!res.ok) { renderApprovalCard(null); return; }
    const data = await res.json();
    renderApprovalCard(data);
  } catch (_) { renderApprovalCard(null); }
}

// ═══════════════ SIDEBAR: WAIVER MAINTENANCE ═══════════════

let currentWaiverRunId = null;

async function loadWaiverRuns() {
  try {
    const res  = await fetch('/api/waivers/runs?t=' + Date.now());
    const data = await res.json();
    const select = document.getElementById('waiver-run-select');
    const runs   = data.runs || [];

    if (runs.length === 0) {
      select.innerHTML = '<option value="">No waiver history yet</option>';
      document.getElementById('waiver-list').innerHTML =
        '<div class="waiver-empty">No waivers to show.</div>';
      return;
    }

    const prevSelection = currentWaiverRunId;
    select.innerHTML = runs.map(r =>
      `<option value="${r.run_id}">${r.run_id} · ${r.waiver_count} waiver${r.waiver_count === 1 ? '' : 's'}</option>`
    ).join('');

    const toSelect = runs.find(r => r.run_id === prevSelection) ? prevSelection : runs[0].run_id;
    select.value = toSelect;
    loadWaiverDetail(toSelect);
  } catch (_) {}
}

async function loadWaiverDetail(runId) {
  currentWaiverRunId = runId;
  const listEl = document.getElementById('waiver-list');
  if (!runId) { listEl.innerHTML = '<div class="waiver-empty">No waivers to show.</div>'; return; }

  try {
    const res = await fetch(`/reports/waivers/${runId}.json?t=` + Date.now());
    if (!res.ok) { listEl.innerHTML = '<div class="waiver-empty">No waivers to show.</div>'; return; }
    const data    = await res.json();
    const waivers = data.waivers || [];

    if (waivers.length === 0) {
      listEl.innerHTML = '<div class="waiver-empty">No waivers for this run.</div>';
      return;
    }

    listEl.innerHTML = '';
    waivers.forEach(w => {
      const item = document.createElement('div');
      item.className = 'waiver-item';
      item.innerHTML = `
        <div class="waiver-item-top">
          <span class="waiver-item-id">${w.check_id}</span>
          <span class="badge badge-${(w.severity || 'low').toLowerCase()}">${w.severity}</span>
        </div>
        <div class="waiver-item-resource">${w.resource}</div>
        <div class="waiver-item-reason" id="reason-text-${w.id}">${w.reason}</div>
        <div class="waiver-item-meta">waived by ${w.waived_by} · ${new Date(w.waived_at).toLocaleString()}</div>
        <div class="waiver-item-actions" id="actions-${w.id}">
          <button class="btn-mini" data-action="edit" data-id="${w.id}">Edit</button>
          <button class="btn-mini danger" data-action="delete" data-id="${w.id}">Delete</button>
        </div>
      `;
      listEl.appendChild(item);
    });

    listEl.querySelectorAll('[data-action="edit"]').forEach(btn => {
      btn.addEventListener('click', () => beginEditWaiver(runId, btn.dataset.id));
    });
    listEl.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', () => confirmDeleteWaiver(runId, btn.dataset.id));
    });
  } catch (_) {
    listEl.innerHTML = '<div class="waiver-empty">Could not load waivers.</div>';
  }
}

function beginEditWaiver(runId, waiverId) {
  const reasonEl  = document.getElementById(`reason-text-${waiverId}`);
  const actionsEl = document.getElementById(`actions-${waiverId}`);
  const currentText = reasonEl.textContent;

  reasonEl.innerHTML = `<textarea class="waiver-edit-textarea" id="edit-area-${waiverId}">${currentText}</textarea>`;
  actionsEl.innerHTML = `
    <button class="btn-mini confirm" data-action="save">Save</button>
    <button class="btn-mini" data-action="cancel">Cancel</button>
  `;

  actionsEl.querySelector('[data-action="save"]').addEventListener('click', async () => {
    const newReason = document.getElementById(`edit-area-${waiverId}`).value.trim();
    if (!newReason) return;
    try {
      const res = await fetch(`/api/waivers/${runId}/${waiverId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason: newReason }),
      });
      if (!res.ok) throw new Error();
      loadWaiverDetail(runId);
    } catch (_) { alert('Could not save the updated reason.'); }
  });

  actionsEl.querySelector('[data-action="cancel"]').addEventListener('click', () => {
    loadWaiverDetail(runId);
  });
}

async function confirmDeleteWaiver(runId, waiverId) {
  if (!confirm('Delete this waiver? The violation will need a fresh decision next run.')) return;
  try {
    const res = await fetch(`/api/waivers/${runId}/${waiverId}`, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    loadWaiverDetail(runId);
    loadWaiverRuns();
  } catch (_) { alert('Could not delete the waiver.'); }
}

document.getElementById('waiver-run-select').addEventListener('change', (e) => {
  loadWaiverDetail(e.target.value);
});

// ═══════════════ INIT / POLL LOOP ═══════════════

buildViolations();
buildBars();
loadWaiverRuns();

let firstPoll = true;

async function poll() {
  try {
    const res = await fetch('/status.json?t=' + Date.now());
    if (res.ok) {
      const data = await res.json();
      if (firstPoll && data.stage === 'idle') await tryLoadLastRun();
      firstPoll = false;
      applyState(data);
    }
  } catch (_) {}
  await pollPendingReview();
  updateFooterTime();
}

poll();
setInterval(poll, POLL_MS);
setInterval(updateFooterTime, 1000);
</script>
